<style>
:root{--bg:#f5f7fa;--surface:#fff;--soft:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#1677ff;--up:#d92d20;--down:#138a4b}*{box-sizing:border-box}html,body{height:100%;min-width:320px;margin:0;color:var(--text);background:var(--bg);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{overflow:hidden}button,select{font:inherit}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff;background:#162033}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:5px;background:var(--primary);font-weight:800}h1{margin:0;font-size:18px}.topnav{display:flex;gap:24px}.topnav a{color:#d0d5dd;text-decoration:none;font-size:13px}.topnav a.active,.topnav a:hover{color:#fff}.toolbar{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:#fff}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:9px}.toolbar-title{font-size:14px;font-weight:700}.toolbar-note{color:var(--muted);font-size:12px}.date-filter{display:flex;align-items:center;gap:6px;color:#475467;font-size:12px}.date-select,.button{height:30px;border:1px solid #d0d5dd;border-radius:4px;background:#fff;color:#344054;font-size:12px}.date-select{min-width:126px;padding:0 8px}.button{padding:0 10px;cursor:pointer;font-weight:600}.button:hover{border-color:var(--primary);color:var(--primary)}.button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.layout{height:calc(100vh - 112px);min-height:520px;display:flex;flex-direction:column}.split-row{display:flex;min-width:0;min-height:0}#topRow{min-height:270px}#bottomRow{min-height:310px}.pane{min-width:0;min-height:0;overflow:hidden;background:var(--surface)}.pane-head{height:45px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}.pane-title{display:flex;align-items:baseline;gap:8px;min-width:0}.pane-title strong{font-size:14px;white-space:nowrap}.pane-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.period-tabs{display:flex;gap:2px}.period-tab{height:25px;padding:0 8px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;font-size:11px}.period-tab.active{border-color:#b2ddff;background:#eaf3ff;color:var(--primary);font-weight:700}.table-holder{height:calc(100% - 45px);overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;color:#344054;font-size:11px;white-space:nowrap}thead{position:sticky;top:0;z-index:2;background:var(--soft)}th,td{height:34px;padding:0 8px;border-right:1px solid #f2f4f7;border-bottom:1px solid #eef1f5;text-align:left}th{color:#475467;font-weight:700}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f9ff}tbody tr.selected{background:#eaf3ff;box-shadow:inset 3px 0 var(--primary)}.up{color:var(--up)}.down{color:var(--down)}.badge{display:inline-flex;min-width:36px;justify-content:center;padding:2px 5px;border:1px solid #f3b4b4;border-radius:3px;background:#fff5f5;color:#b42318;font-size:10px}.ladder-group td{height:28px;padding:0 9px;border-right:0;background:#f8fafc;color:#175cd3;font-weight:700}.chart-panel{position:relative;height:calc(100% - 45px);min-height:0;overflow:hidden}.chart{width:100%;height:100%}.chart-label{position:absolute;top:7px;left:10px;z-index:2;color:#475467;font-size:11px;font-weight:700;pointer-events:none}.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}.hidden{display:none!important}.gutter{z-index:5;background:#e7ebf0;background-repeat:no-repeat;background-position:center}.gutter:hover{background-color:#b7c8df}.gutter-horizontal{width:7px;cursor:col-resize;background-image:linear-gradient(90deg,transparent 2px,#98a2b3 2px,#98a2b3 5px,transparent 5px)}.gutter-vertical{height:7px;cursor:row-resize;background-image:linear-gradient(0deg,transparent 2px,#98a2b3 2px,#98a2b3 5px,transparent 5px)}@media(max-width:1000px){.topnav{display:none}.toolbar-note{display:none}}@media(max-width:720px){body{overflow:auto}.topbar{padding:0 12px}.layout{height:auto;min-height:1850px}.split-row{flex-wrap:wrap;min-height:700px}.pane{min-height:260px}.toolbar{align-items:flex-start;flex-wrap:wrap}.toolbar-right{flex-wrap:wrap}}
.ladder-controls{display:flex;align-items:center;gap:3px;min-width:0}.ladder-tab{height:28px;padding:0 10px;border:0;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;white-space:nowrap}.ladder-tab.active{background:#eaf3ff;color:var(--primary);font-weight:700}.ladder-field-btn{height:26px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);cursor:pointer;font-size:11px}.ladder-field-btn:hover{border-color:var(--primary);color:var(--primary)}.ladder-sort{border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font:inherit;font-weight:700}.ladder-sort:hover{color:var(--primary)}.ladder-empty{padding:16px;color:var(--muted);text-align:center}.ladder-dialog{width:min(460px,calc(100vw - 28px));padding:0;border:0;border-radius:6px;box-shadow:0 16px 40px #10182833}.ladder-dialog::backdrop{background:#10182859}.ladder-dialog-head,.ladder-dialog-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.ladder-dialog-foot{justify-content:flex-end;gap:8px;border-top:1px solid var(--line);border-bottom:0}.ladder-dialog-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:55vh;overflow:auto;padding:14px 16px}.ladder-field-option{display:flex;align-items:center;gap:8px;font-size:13px;color:#344054}.ladder-field-option input{accent-color:var(--primary)}
</style></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">梯</div><h1>连板天梯</h1></div><nav class="topnav"><a href="./auction-monitor.html">竞价监控</a><a href="./market-management.html">市场管理</a><a class="active" href="./limit-up-ladder.html">连板天梯</a><a href="./custom-sector-tracker.html">板块自定义追踪</a><a href="./data-viewer.html">市场数据</a><a href="./history-viewer.html">历史数据</a><a href="./key-management.html">密钥管理</a></nav></header>
<div class="toolbar"><div class="toolbar-left"><span class="toolbar-title">概念与连板梯队联动</span><span class="toolbar-note">上方查看板块强弱，下方对照昨日与今日连板结构</span></div><div class="toolbar-right"><label class="date-filter">梯队日期 <select id="ladderDate" class="date-select"></select></label><span id="dataStatus" class="toolbar-note">加载中</span><button id="refreshButton" class="button">读取本地</button><button id="updateButton" class="button primary">更新数据</button></div></div>
<main class="layout"><section class="split-row" id="topRow">
<article class="pane" id="sectorPane"><div class="pane-head"><div class="pane-title"><strong>概念板块</strong><span id="sectorMeta">加载中</span></div></div><div class="table-holder"><table id="sectorTable"><thead><tr><th>序号</th><th>概念</th><th>涨幅</th><th>涨家数</th><th>跌家数</th><th>涨停数</th></tr></thead><tbody></tbody></table></div></article>
<article class="pane" id="sectorKPane"><div class="pane-head"><div class="pane-title"><strong id="sectorKTitle">板块 K 线</strong><span id="sectorKMeta">请选择概念板块</span></div><div class="period-tabs"><button class="period-tab active" data-chart="sector" data-period="daily">日K</button><button class="period-tab" data-chart="sector" data-period="weekly">周K</button><button class="period-tab" data-chart="sector" data-period="monthly">月K</button></div></div><div class="chart-panel"><span class="chart-label">K线</span><div id="sectorChart" class="chart"></div><div id="sectorKEmpty" class="chart-empty">选择概念板块查看 K 线</div></div></article>
<article class="pane" id="sectorIntradayPane"><div class="pane-head"><div class="pane-title"><strong>板块分时</strong><span id="sectorIntradayMeta">请选择概念板块</span></div></div><div class="chart-panel"><span class="chart-label">分时</span><div id="sectorIntradayChart" class="chart"></div><div id="sectorIntradayEmpty" class="chart-empty">选择概念板块查看分时</div></div></article></section>
<section class="split-row" id="bottomRow"><article class="pane" id="yesterdayPane"><div class="pane-head"><div class="pane-title"><strong>昨日连板天梯榜</strong><span id="yesterdayMeta">加载中</span></div></div><div class="table-holder"><table id="yesterdayTable"><thead><tr><th>代码</th><th>名称</th><th>连板</th><th>涨停时间</th></tr></thead><tbody></tbody></table></div></article>
<article class="pane" id="todayPane"><div class="pane-head"><div class="pane-title"><strong>今日连板天梯榜</strong><span id="todayMeta">加载中</span></div></div><div class="table-holder"><table id="todayTable"><thead><tr><th>代码</th><th>名称</th><th>连板</th><th>类型</th></tr></thead><tbody></tbody></table></div></article>
<article class="pane" id="stockKPane"><div class="pane-head"><div class="pane-title"><strong id="stockKTitle">个股 K 线</strong><span id="stockKMeta">从天梯榜选择个股</span></div><div class="period-tabs"><button class="period-tab active" data-chart="stock" data-period="daily">日K</button><button class="period-tab" data-chart="stock" data-period="weekly">周K</button><button class="period-tab" data-chart="stock" data-period="monthly">月K</button></div></div><div class="chart-panel"><span class="chart-label">K线</span><div id="stockChart" class="chart"></div><div id="stockKEmpty" class="chart-empty">选择天梯榜中的个股查看 K 线</div></div></article>
<article class="pane" id="stockIntradayPane"><div class="pane-head"><div class="pane-title"><strong>个股分时</strong><span id="stockIntradayMeta">从天梯榜选择个股</span></div></div><div class="chart-panel"><span class="chart-label">分时</span><div id="stockIntradayChart" class="chart"></div><div id="stockIntradayEmpty" class="chart-empty">选择天梯榜中的个股查看分时</div></div></article></section></main>
<dialog class="ladder-dialog" id="ladderFieldDialog"><div class="ladder-dialog-head"><strong>天梯字段设置</strong><button class="ladder-field-btn" id="closeLadderFieldDialog">关闭</button></div><div class="ladder-dialog-body" id="ladderFieldOptions"></div><div class="ladder-dialog-foot"><button class="button" id="resetLadderFields">恢复默认</button><button class="button primary" id="applyLadderFields">应用</button></div></dialog>
<style>.ladder-sort{display:inline-flex;align-items:center;gap:7px;width:100%;min-height:30px}.sort-indicator{display:inline-flex;flex-direction:column;gap:2px;margin-left:auto}.sort-indicator:before,.sort-indicator:after{content:"";border-left:4px solid transparent;border-right:4px solid transparent}.sort-indicator:before{border-bottom:5px solid #b8c0cc}.sort-indicator:after{border-top:5px solid #b8c0cc}.sort-indicator.ascending:before{border-bottom-color:var(--primary)}.sort-indicator.descending:after{border-top-color:var(--primary)}</style>
<script src="./kline-tooltip.js?v=4"></script>
<script src="./chart-request.js?v=1"></script>
<script>
const $=id=>document.getElementById(id);
const state={dates:[],date:"",yesterdayDate:"",sectors:[],sector:null,stock:null,boards:{yesterday:[],today:[]},period:{sector:"daily",stock:"daily"},scope:"market",market:"all",preferences:{},sectorSort:{key:"changePct",dir:-1},ladderSort:{yesterday:{key:"boardCount",dir:-1},today:{key:"boardCount",dir:-1}}};
const charts={sector:echarts.init($("sectorChart")),sectorIntraday:echarts.init($("sectorIntradayChart")),stock:echarts.init($("stockChart")),stockIntraday:echarts.init($("stockIntradayChart"))};
const requests=ChartRequest.createLatestRequests();
const json=async(url,opt)=>{const response=await fetch(url,{cache:"no-store",...opt}),body=await response.json();if(!response.ok||body.ok===false)throw Error(body.error||"请求失败");return body};
const displayDate=x=>{const s=String(x||"").replace(/-/g,"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`:s||"--"};
const pct=x=>ChartRequest.missing(x)||!Number.isFinite(Number(x))?"--":`${Number(x)>=0?"+":""}${Number(x).toFixed(2)}%`;
const fmt=x=>ChartRequest.missing(x)||!Number.isFinite(Number(x))?"--":Number(x).toFixed(2);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ladderFieldDefs=[{key:'name',label:'名称'},{key:'boardCount',label:'连板'},{key:'changePct',label:'涨幅'},{key:'auctionChangePct',label:'竞价涨幅'},{key:'turnoverPct',label:'换手'},{key:'firstLimitTime',label:'首次涨停时间'},{key:'lastLimitTime',label:'最终涨停时间'},{key:'sealAmount',label:'封单金额'},{key:'limitAmount',label:'涨停成交金额'},{key:'circulatingMarketCap',label:'流通市值'},{key:'limitTypes',label:'涨停类型'},{key:'limitReason',label:'涨停原因标签'},{key:'limitReasonDetail',label:'涨停详细原因'},{key:'marketType',label:'上市板块'},{key:'industry',label:'所属行业'}];
const defaultLadderFields=['name','boardCount','changePct','auctionChangePct','turnoverPct','firstLimitTime','lastLimitTime','sealAmount','limitAmount','circulatingMarketCap','limitTypes','limitReason','limitReasonDetail'];
const legacyLadderFields=['name','boardCount','changePct','turnoverPct','firstLimitTime','lastLimitTime','sealAmount','limitAmount','circulatingMarketCap','limitTypes'];

function activeFields(){const saved=state.preferences["ladder-fields"];if(!Array.isArray(saved)||!saved.length)return defaultLadderFields;const selected=saved.length===legacyLadderFields.length&&saved.every((key,index)=>key===legacyLadderFields[index])?defaultLadderFields:saved;return selected.filter(key=>ladderFieldDefs.some(def=>def.key===key))}
function money(value){if(ChartRequest.missing(value)||!Number.isFinite(Number(value)))return "--";const n=Number(value);return Math.abs(n)>=1e8?`${(n/1e8).toFixed(2)}亿`:Math.abs(n)>=1e4?`${(n/1e4).toFixed(2)}万`:n.toLocaleString("zh-CN")}
function typeText(value){return (Array.isArray(value)?value:value?[value]:[]).map(item=>item.label||item).join("、")||"--"}
function ladderValue(row,key){return key==="limitTypes"?typeText(row.limitTypes):row[key]}
function ladderCell(row,key){const value=ladderValue(row,key);if(key==="name")return `<strong>${esc(value||"--")}</strong>`;if(key==="boardCount")return ChartRequest.missing(value)?"--":`<span class="badge">${esc(value)}板</span>`;if(["changePct","auctionChangePct","turnoverPct"].includes(key))return `<span class="${Number(value)>0?"up":Number(value)<0?"down":""}">${pct(value)}</span>`;if(["sealAmount","limitAmount","circulatingMarketCap"].includes(key))return money(value);return esc(ChartRequest.missing(value)?"--":value)}
function resize(){Object.values(charts).forEach(chart=>chart.resize())}
function renderSectors(){
  const sort=state.sectorSort,rows=state.sectors.map(row=>({...row})).sort((a,b)=>ChartRequest.compare(a[sort.key],b[sort.key],sort.dir));
  rows.forEach((row,index)=>{row.rowNumber=index+1});
  const table=$("sectorTable");
  const fields=[["rowNumber","序号"],["name","概念"],["changePct","涨幅"],["upCount","涨家数"],["downCount","跌家数"],["limitUpCount","涨停数"]];
  table.querySelector("thead").innerHTML=`<tr>${fields.map(([key,label])=>ChartRequest.sortHeader(label,key,sort,"data-sector-sort","ladder-sort")).join("")}</tr>`;
  table.querySelector("tbody").innerHTML=rows.map(row=>`<tr data-code="${esc(row.code)}" class="${row.code===state.sector?.code?"selected":""}">${fields.map(([key])=>`<td class="${key==="changePct"?(Number(row[key])>0?"up":Number(row[key])<0?"down":""):""}">${key==="changePct"?pct(row[key]):esc(row[key]??"--")}</td>`).join("")}</tr>`).join("")||'<tr><td colspan="6">暂无概念板块数据</td></tr>';
  table.querySelectorAll("[data-sector-sort]").forEach(button=>button.onclick=()=>{toggleSort(sort,button.dataset.sectorSort);renderSectors()});
  table.querySelectorAll("tbody tr[data-code]").forEach(row=>row.onclick=()=>selectSector(state.sectors.find(item=>item.code===row.dataset.code)));
}
function toggleSort(sort,key){if(sort.key===key)sort.dir*=-1;else{sort.key=key;sort.dir=["name","code","rowNumber"].includes(key)?1:-1}}
function renderLadder(name){
  const table=$(name+"Table"),sort=state.ladderSort[name],fields=activeFields(),rows=[...state.boards[name]].sort((a,b)=>ChartRequest.compare(ladderValue(a,sort.key),ladderValue(b,sort.key),sort.dir)),counts=new Map();
  rows.forEach(row=>counts.set(row.boardCount,(counts.get(row.boardCount)||0)+1));let board;
  table.querySelector("thead").innerHTML=`<tr>${fields.map(key=>ChartRequest.sortHeader(ladderFieldDefs.find(def=>def.key===key).label,key,sort,"data-ladder-sort","ladder-sort")).join("")}</tr>`;
  table.querySelector("tbody").innerHTML=rows.map(row=>{const divider=sort.key==="boardCount"&&row.boardCount!==board?`<tr class="ladder-group"><td colspan="${fields.length}">${esc(row.boardCount??"--")} 连板 · ${counts.get(row.boardCount)} 只</td></tr>`:"";board=row.boardCount;return `${divider}<tr data-code="${esc(row.code)}" class="${state.stock?.code===row.code?"selected":""}">${fields.map(key=>`<td>${ladderCell(row,key)}</td>`).join("")}</tr>`}).join("")||`<tr><td colspan="${fields.length}" class="ladder-empty">暂无符合条件的天梯数据</td></tr>`;
  table.querySelectorAll("[data-ladder-sort]").forEach(button=>button.onclick=()=>{toggleSort(sort,button.dataset.ladderSort);renderLadder(name)});
  table.querySelectorAll("tbody tr[data-code]").forEach(row=>row.onclick=()=>selectStock(rows.find(item=>item.code===row.dataset.code)));
}
function clearCharts(type,message){requests.cancel(type+"-kline");requests.cancel(type+"-intraday");charts[type].clear();charts[type+"Intraday"].clear();for(const kind of ["K","Intraday"]){const empty=$(type+kind+"Empty");empty.textContent=message;empty.classList.remove("hidden");$(type+kind+"Meta").textContent=""}}
function selectSector(row){if(!row)return;const changed=state.sector?.code!==row.code;state.sector=row;renderSectors();$("sectorKTitle").textContent=`${row.name} K线`;if(changed){loadChart("sector",row.code);loadIntraday("sector",row.code,state.date)}if(changed&&state.scope==="sector")loadLadders()}
function selectStock(row){if(!row){state.stock=null;clearCharts("stock","请选择天梯榜中的个股");return}const changed=state.stock?.code!==row.code;state.stock=row;renderLadder("today");renderLadder("yesterday");$("stockKTitle").textContent=`${row.name} K线`;if(changed){loadChart("stock",row.code);loadIntraday("stock",row.code,state.date)}}
function loadSectors(force=false){
  const date=state.date,query=new URLSearchParams({date,limit:"5000"});if(force)query.set("force","1");
  return requests.run("sectors",`/api/market-management/sectors?${query}`,{
    isCurrent:()=>state.date===date,
    loading:()=>{$("sectorMeta").textContent=`${displayDate(date)} · 读取中`},
    success(body){state.sectors=body.items||[];$("sectorMeta").textContent=`${displayDate(body.date||date)} · ${state.sectors.length} 个 · ${body.source||"stockdb"}`;const selected=state.sectors.find(row=>row.code===state.sector?.code)||state.sectors[0];if(selected)selectSector(selected);else{state.sector=null;renderSectors();clearCharts("sector","暂无概念板块数据")}},
    error(error){$("sectorMeta").textContent=error.message;state.sectors=[];state.sector=null;renderSectors();clearCharts("sector",error.message)}
  });
}
function loadLadders(force=false){
  const date=state.date,market=state.market,scope=state.scope,sector=state.sector?.code;
  const index=state.dates.indexOf(date);state.yesterdayDate=state.dates[index+1]||"";
  const isCurrent=()=>state.date===date&&state.market===market&&state.scope===scope&&(scope!=="sector"||state.sector?.code===sector);
  if(scope==="sector"&&!sector){for(const name of ["today","yesterday"]){requests.cancel("ladder-"+name);state.boards[name]=[];renderLadder(name);$(name+"Meta").textContent="请先选择概念板块"}return Promise.resolve()}
  return Promise.all(["today","yesterday"].map(name=>{
    const requestedDate=name==="today"?date:state.yesterdayDate;
    if(!requestedDate){requests.cancel("ladder-"+name);state.boards[name]=[];renderLadder(name);$(name+"Meta").textContent="无上一交易日";return}
    const query=new URLSearchParams({date:requestedDate,market,types:"1"});if(scope==="sector")query.set("sector",sector);if(force)query.set("force","1");
    return requests.run("ladder-"+name,`/api/market-management/limit-up-ladder?${query}`,{
      isCurrent,
      loading:()=>{$(name+"Meta").textContent=`${displayDate(requestedDate)} · 读取中`},
      success(body){if(body.date&&String(body.date).replace(/-/g,"")!==requestedDate)throw Error("天梯交易日不一致");state.boards[name]=(body.items||[]).map(item=>({...item,code:String(item.code),boardCount:item.board_count??item.boardCount??null}));$(name+"Meta").textContent=`${displayDate(requestedDate)} · ${state.boards[name].length} 只${body.typeStatus?" · "+body.typeStatus:""}`;renderLadder(name)},
      error(error){state.boards[name]=[];renderLadder(name);$(name+"Meta").textContent=error.message}
    });
  })).then(()=>{if(!isCurrent())return;const all=state.boards.today.concat(state.boards.yesterday);if(!all.some(row=>row.code===state.stock?.code))selectStock(all[0]||null)});
}
function drawK(c,rows){const d=rows.map(x=>displayDate(x.date)),k=rows.map(x=>[x.open,x.close,x.low,x.high]);c.setOption({animation:false,grid:[{left:52,right:16,top:35,height:'60%'},{left:52,right:16,bottom:27,height:'18%'}],tooltip:{trigger:'axis',axisPointer:{type:'cross'},formatter:p=>KlineTooltip.format(rows,p?.[0]?.dataIndex??0)},xAxis:[{type:'category',data:d},{type:'category',gridIndex:1,data:d,axisLabel:{show:false}}],yAxis:[{scale:true},{gridIndex:1,axisLabel:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1]},{type:'slider',xAxisIndex:[0,1],height:18,bottom:1}],series:[{type:'candlestick',data:k,itemStyle:{color:'#d92d20',color0:'#138a4b',borderColor:'#d92d20',borderColor0:'#138a4b'}},{type:'bar',xAxisIndex:1,yAxisIndex:1,data:rows.map(x=>({value:Number(x.volume||0),itemStyle:{color:Number(x.close)>=Number(x.open)?'#d92d20':'#138a4b'}})),barMaxWidth:8}]},true);c.resize()}function drawTime(c,rows){const t=rows.map(x=>String(x.time||'').replace(/^(\d{2})(\d{2})$/,'$1:$2')),p=rows.map(x=>Number(x.price||0));c.setOption({animation:false,grid:[{left:48,right:12,top:32,height:'61%'},{left:48,right:12,bottom:25,height:'18%'}],tooltip:{trigger:'axis'},xAxis:[{type:'category',boundaryGap:false,data:t},{type:'category',gridIndex:1,data:t,axisLabel:{show:false}}],yAxis:[{scale:true},{gridIndex:1,axisLabel:{show:false}}],series:[{type:'line',data:p,showSymbol:false,lineStyle:{color:'#1677ff'}},{type:'bar',xAxisIndex:1,yAxisIndex:1,data:rows.map((x,i)=>({value:Number(x.volume||0),itemStyle:{color:Number(x.price||0)>=Number(rows[i-1]?.price??x.price??0)?'#d92d20':'#138a4b'}})),barMaxWidth:5}]},true);c.resize()}
function loadChart(type,code,force=false){
  const date=state.date,period=state.period[type],empty=$(type+"KEmpty"),meta=$(type+"KMeta"),query=new URLSearchParams({code,date,period,limit:"1000"});if(force)query.set("force","1");
  return requests.run(type+"-kline",`/api/market-management/${type}-kline?${query}`,{
    isCurrent:()=>state.date===date&&state.period[type]===period&&state[type]?.code===code,
    loading({refresh}){if(refresh)return;charts[type].clear();empty.textContent="K线加载中";empty.classList.remove("hidden");meta.textContent=`${displayDate(date)} · 读取中`},
    success(body){if(!body.items?.length)throw Error(body.error||"暂无 K 线数据");if(body.items.some(row=>String(row.date).replace(/-/g,"")>date))throw Error("K线日期与当前选择不一致");drawK(charts[type],body.items);empty.classList.add("hidden");meta.textContent=`${body.source||"本地"} · 截至 ${displayDate(body.items.at(-1).date)}`},
    error(error){charts[type].clear();empty.textContent=error.message;empty.classList.remove("hidden");meta.textContent=`${displayDate(date)} · 未获取数据`}
  });
}
function loadIntraday(type,code,date,force=false){
  const empty=$(type+"IntradayEmpty"),meta=$(type+"IntradayMeta"),query=new URLSearchParams({code,date,kind:type});if(force)query.set("force","1");
  return requests.run(type+"-intraday",`/api/market-management/intraday?${query}`,{
    isCurrent:()=>state.date===date&&state[type]?.code===code,
    loading({refresh}){if(refresh)return;charts[type+"Intraday"].clear();empty.textContent="分时加载中";empty.classList.remove("hidden");meta.textContent=`${displayDate(date)} · 读取中`},
    success(body){if(!body.items?.length)throw Error(body.error||`${displayDate(date)} 暂无分时数据`);if(body.date&&String(body.date).replace(/-/g,"")!==date)throw Error("分时日期与当前选择不一致");drawTime(charts[type+"Intraday"],body.items);empty.classList.add("hidden");meta.textContent=`${displayDate(date)} · ${body.source||"本地"}`},
    error(error){charts[type+"Intraday"].clear();empty.textContent=error.message;empty.classList.remove("hidden");meta.textContent=`${displayDate(date)} · 未获取数据`}
  });
}
function layout(){Split(["#topRow","#bottomRow"],{direction:"vertical",sizes:[45,55],minSize:[240,280],gutterSize:7,onDragEnd:resize});Split(["#sectorPane","#sectorKPane","#sectorIntradayPane"],{direction:"horizontal",sizes:[34,33,33],minSize:[280,320,280],gutterSize:7,onDragEnd:resize});Split(["#yesterdayPane","#todayPane","#stockKPane","#stockIntradayPane"],{direction:"horizontal",sizes:[24,24,27,25],minSize:[240,240,300,280],gutterSize:7,onDragEnd:resize})}
document.querySelector(".toolbar-left").insertAdjacentHTML("beforeend",'<div class="ladder-controls"><button class="ladder-tab active" data-ladder-scope="market">全市场</button><button class="ladder-tab" data-ladder-scope="sector">当前概念</button></div><div class="ladder-controls"><button class="ladder-tab active" data-ladder-market="all">全部</button><button class="ladder-tab" data-ladder-market="main">主板</button><button class="ladder-tab" data-ladder-market="创业板">创业板</button><button class="ladder-tab" data-ladder-market="科创板">科创板</button><button class="ladder-tab" data-ladder-market="京A">京A</button></div>');
document.querySelectorAll("#yesterdayPane .pane-head,#todayPane .pane-head").forEach(head=>head.insertAdjacentHTML("beforeend",'<button class="ladder-field-btn" data-ladder-fields>字段设置</button>'));
function saveFields(fields){state.preferences["ladder-fields"]=fields;fetch("/api/market-management/preferences",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({preferences:{"ladder-fields":fields}})}).catch(()=>{});$("ladderFieldDialog").close();renderLadder("today");renderLadder("yesterday")}
document.querySelectorAll("[data-ladder-fields]").forEach(button=>button.onclick=()=>{const selected=activeFields();$("ladderFieldOptions").innerHTML=ladderFieldDefs.map(def=>`<label class="ladder-field-option"><input type="checkbox" data-ladder-field="${def.key}" ${selected.includes(def.key)?"checked":""}>${def.label}</label>`).join("");$("ladderFieldDialog").showModal()});
$("closeLadderFieldDialog").onclick=()=>$("ladderFieldDialog").close();
$("applyLadderFields").onclick=()=>{const fields=[...$("ladderFieldOptions").querySelectorAll("input:checked")].map(input=>input.dataset.ladderField);if(!fields.includes("name"))fields.unshift("name");saveFields(fields)};
$("resetLadderFields").onclick=()=>saveFields(defaultLadderFields);
document.querySelectorAll("[data-ladder-scope],[data-ladder-market]").forEach(button=>button.onclick=()=>{const kind=button.dataset.ladderScope!==undefined?"scope":"market",key=kind==="scope"?"ladderScope":"ladderMarket";state[kind]=button.dataset[key];document.querySelectorAll(`[data-ladder-${kind}]`).forEach(item=>item.classList.toggle("active",item===button));loadLadders()});
$("ladderDate").onchange=()=>{state.date=$("ladderDate").value;requests.cancelAll();state.boards.today=[];state.boards.yesterday=[];renderLadder("today");renderLadder("yesterday");if(state.sector){loadChart("sector",state.sector.code);loadIntraday("sector",state.sector.code,state.date)}if(state.stock){loadChart("stock",state.stock.code);loadIntraday("stock",state.stock.code,state.date)}loadSectors();loadLadders()};
async function refresh(force){$("dataStatus").textContent=force?"更新中":"读取中";await Promise.all([loadSectors(force),loadLadders(force)]);for(const type of ["sector","stock"])if(state[type]){loadChart(type,state[type].code,force);loadIntraday(type,state[type].code,state.date,force)}$("dataStatus").textContent="读取结束"}
$("refreshButton").onclick=()=>refresh(false);$("updateButton").onclick=()=>refresh(true);
document.querySelectorAll("[data-chart][data-period]").forEach(button=>button.onclick=()=>{const {chart,period}=button.dataset;if(state.period[chart]===period)return;state.period[chart]=period;document.querySelectorAll(`[data-chart="${chart}"]`).forEach(item=>item.classList.toggle("active",item===button));if(state[chart])loadChart(chart,state[chart].code)});
window.onresize=resize;
(async()=>{try{const [body,preferences]=await Promise.all([json("/api/market-management/trading-dates"),json("/api/market-management/preferences").catch(()=>({}))]);state.preferences=preferences.preferences||{};state.dates=[...new Set(body.dates||[])].sort((a,b)=>b.localeCompare(a));state.date=state.dates[0]||body.latest||"";$("ladderDate").innerHTML=state.dates.slice(0,80).map(date=>`<option value="${date}">${displayDate(date)}</option>`).join("");$("ladderDate").value=state.date;layout();if(!state.date)throw Error("暂无可用交易日");await Promise.all([loadSectors(),loadLadders()]);$("dataStatus").textContent="读取结束"}catch(error){$("dataStatus").textContent=error.message}})();
</script></body></html>

window.addEventListener("DOMContentLoaded",()=>{
const $=id=>document.getElementById(id),state={sector:null,stock:null,sectors:[],stocks:[],allStocks:[],stockMeta:null,filter:"all",market:"all",stockSource:"mx",sort:{sector:{key:"rowNumber",dir:1},stock:{key:"rowNumber",dir:1}},period:{sector:"daily",stock:"daily"},date:"",preferences:{},editing:""};

const fields={sector:[{key:"rowNumber",label:"序号",hint:"当前列表中的序号"},{key:"name",label:"板块名称",hint:"同花顺概念板块名称"},{key:"changePct",label:"涨幅",hint:"板块当前涨跌幅"},{key:"auctionChangePct",label:"竞价涨幅",hint:"集合竞价成交价相对昨日收盘价的涨跌幅"},{key:"upCount",label:"涨家数",hint:"板块内当前上涨股票数量"},{key:"downCount",label:"跌家数",hint:"板块内当前下跌股票数量"},{key:"limitUpCount",label:"涨停数",hint:"同花顺涨停池统计的板块内涨停股票数量"},{key:"limitDownCount",label:"跌停数",hint:"板块内当前跌停股票数量"},{key:"lowPriceTime",label:"最低价时间",hint:"当日分时最低价出现的时间"},{key:"highPriceTime",label:"最高价时间",hint:"当日分时最高价出现的时间"}],stock:[{key:"rowNumber",label:"序号",hint:"当前列表中的序号"},{key:"name",label:"个股名称",hint:"股票简称"},{key:"code",label:"代码",hint:"证券代码"},{key:"marketType",label:"上市板块",hint:"深A主板、沪A主板、创业板、科创板或京A"},{key:"boardLabel",label:"连板数",hint:"当前股票是几连板"},{key:"yesterdayBoardCount",label:"昨日连板",hint:"昨日收盘时的连续涨停板数"},{key:"todayOpen",label:"今日开盘价",hint:"当日正式开盘价；竞价期间尚未形成时为空"},{key:"auctionPrice",label:"竞价成交价",hint:"集合竞价撮合结束时形成的价格；竞价前为空"},{key:"auctionChangePct",label:"竞价涨幅",hint:"竞价成交价相对昨日收盘价的涨跌幅"},{key:"yesterdayHigh",label:"昨日最高价",hint:"上一交易日分时最高成交价"},{key:"yesterdayClose",label:"昨日收盘价",hint:"上一交易日正式收盘价"},{key:"latestPrice",label:"现价",hint:"当前来源返回的最新成交价"},{key:"turnoverPct",label:"换手率",hint:"当前来源返回的换手率"},{key:"auctionVolume",label:"竞价成交量",hint:"集合竞价阶段成交量"},{key:"auctionAmount",label:"竞价成交额",hint:"集合竞价阶段成交金额"}]};

const charts={sector:echarts.init($("sectorChart")),stock:echarts.init($("stockChart")),sectorIntraday:echarts.init($("sectorIntradayChart")),stockIntraday:echarts.init($("stockIntradayChart"))};
const json=async(url,opt)=>{const r=await fetch(url,opt),b=await r.json();if(!r.ok||b.ok===false)throw Error(b.error||"请求失败");return b};function fmt(v,d=2){return v==null||v===""||!Number.isFinite(Number(v))?"--":Number(v).toFixed(d)}function pct(v){return v==null||!Number.isFinite(Number(v))?"--":`${Number(v)>=0?"+":""}${Number(v).toFixed(2)}%`}function cls(v){return Number(v)>0?"up":Number(v)<0?"down":""}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function dateLabel(v){const s=String(v||"");return/^\d{8}$/.test(s)?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`:s}function persist(p){state.preferences={...state.preferences,...p};fetch("/api/auction-management/preferences",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({preferences:p})}).catch(()=>{})}async function loadPrefs(){try{const b=await json("/api/auction-management/preferences");state.preferences=b.preferences||{}}catch{} }function enabled(n){const x=state.preferences[`auction-fields-${n}`];return Array.isArray(x)&&x.length?x:defaults[n]}
function boardText(r){const count=Number(r.boardCount);if(Number.isFinite(count)&&count>0)return`${count}连板`;const label=String(r.boardLabel||"");const digits=label.match(/(\d+)/);if(digits)return`${digits[1]}连板`;if(/首板/.test(label))return"1连板";if(/连板/.test(label)&&Number.isFinite(Number(r.yesterdayBoardCount)))return`${Number(r.yesterdayBoardCount)+1}连板`;return label||"--"}
function cell(k,r,i){if(k==="rowNumber")return r.rowNumber??i+1;if(k==="changePct"||k==="auctionChangePct")return pct(r[k]);if(["todayOpen","auctionPrice","yesterdayHigh","yesterdayClose","latestPrice"].includes(k))return fmt(r[k]);if(k==="turnoverPct")return r[k]==null?"--":`${fmt(r[k])}%`;if(k==="auctionAmount")return r[k]==null?"--":Number(r[k]).toLocaleString("zh-CN");if(k==="marketType")return`<span class="market-badge">${esc(r[k]||"--")}</span>`;if(k==="boardLabel")return`<span class="board-badge">${esc(boardText(r))}</span>`;if(k==="yesterdayBoardCount")return r[k]==null?"--":`${r[k]}板`;return esc(r[k]??"--")}
function sourceLabel(source){return ({cmes:"CMES VIP",mx:"妙想",sina:"新浪",tencent:"腾讯"}[source]||source)}
function sortValue(row,key){if(key==="boardLabel"){const count=Number(row.boardCount);if(count>0)return count;const digits=boardText(row).match(/(\d+)/);return digits?Number(digits[1]):null}return row[key]}
function renderTable(name,items){
  const table=$(name+"Table"),keys=enabled(name),defs=fields[name].filter(field=>keys.includes(field.key)),sort=state.sort[name];
  const rows=(items||[]).map((row,index)=>({...row,rowNumber:index+1})).sort((a,b)=>ChartRequest.compare(sortValue(a,sort.key),sortValue(b,sort.key),sort.dir));
  rows.forEach((row,index)=>{row.rowNumber=index+1});
  table.querySelector("thead").innerHTML=`<tr>${defs.map(field=>ChartRequest.sortHeader(field.label,field.key,sort)).join("")}</tr>`;
  table.querySelector("tbody").innerHTML=rows.map((row,index)=>`<tr data-code="${esc(row.code)}" class="${state[name]?.code===row.code?"selected":""}">${defs.map(field=>`<td class="${["changePct","auctionChangePct"].includes(field.key)?cls(row[field.key]):""}">${cell(field.key,row,index)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${defs.length}">暂无数据</td></tr>`;
  table.querySelectorAll("[data-sort]").forEach(button=>button.onclick=()=>{const key=button.dataset.sort;if(sort.key===key)sort.dir*=-1;else{sort.key=key;sort.dir=["rowNumber","name","code","marketType"].includes(key)?1:-1}renderTable(name,items)});
  table.querySelectorAll("tbody tr[data-code]").forEach(row=>row.onclick=()=>name==="sector"?selectSector(rows.find(item=>String(item.code)===row.dataset.code)):selectStock(rows.find(item=>String(item.code)===row.dataset.code)));
}
async function loadDates(){
  const body=await json("/api/market-management/trading-dates"),dates=[...new Set(body.dates||[])].sort((a,b)=>b.localeCompare(a));
  const saved=String(state.preferences["auction-date"]||"");state.date=dates.includes(saved)?saved:dates[0]||body.latest||"";

  if(!state.date)throw Error("暂无可用交易日");

async function loadStatus(){
  const source=state.stockSource;
  try{
    const body=await json(source==="cmes"?"/api/cmes/status":"/api/auction-management/status");if(source!==state.stockSource)return;
    if(source==="cmes"){$("dataStatus").textContent=body.ok?"CMES VIP 已连接":body.error||"CMES VIP 未授权";return}
    const info=body.stockSources?.[source];$("dataStatus").textContent=info?.label?`${info.label} ${source==="mx"?(body.mxConfigured?"已配置":"未配置 MX_APIKEY"):"行情接口可用"}`:"数据源状态未知";
  }catch(error){if(source===state.stockSource)$("dataStatus").textContent=error.message}
}
function clearCharts(type,message){
  requests.cancel(type+"-kline");requests.cancel(type+"-intraday");charts[type].clear();charts[type+"Intraday"].clear();
  for(const kind of ["K","Intraday"]){$(type+kind+"Empty").textContent=message;$(type+kind+"Empty").classList.remove("hidden")}
  $(type+"ChartMeta").textContent="";$(type+"IntradayMeta").textContent="";
}
function resetStock(){
  requests.cancel("stocks");state.stock=null;state.stocks=[];state.allStocks=[];state.stockMeta=null;renderTable("stock",[]);
  $("stockSelectedState").textContent="未选择个股";$("stockSelectedState").classList.add("empty");$("stockChartTitle").textContent="个股K线";clearCharts("stock","请选择个股");
}
function loadSectors(force=false){
  const date=state.date,query=new URLSearchParams({date,limit:"5000"});if(force)query.set("force","1");
  return requests.run("sectors",`/api/auction-management/sectors?${query}`,{
    isCurrent:()=>state.date===date,
    loading(){$("sectorCount").textContent=`${dateLabel(date)} · 读取中`},
    success(body){if(body.date&&String(body.date).replace(/-/g,"")!==date)throw Error("板块列表交易日与当前选择不一致");state.sectors=body.items||[];$("sectorCount").textContent=`${dateLabel(body.date||date)} · ${body.total??state.sectors.length} 个 · ${body.dataSource||body.source||"本地"}`;const row=state.sectors.find(item=>item.code===state.sector?.code)||state.sectors[0];renderTable("sector",state.sectors);if(row)selectSector(row);else{state.sector=null;resetStock();clearCharts("sector","暂无概念板块数据")}},
    error(error){state.sectors=[];state.sector=null;renderTable("sector",[]);resetStock();clearCharts("sector",error.message);$("sectorCount").textContent=error.message}
  });
}
function applyStockView(){
  state.stocks=(state.allStocks||[]).filter(row=>{
    const type=String(row.marketType||""),marketOk=state.market==="all"||state.market==="main"&&/主板/.test(type)||type===state.market,p=Number(row.auctionChangePct);
    const filterOk=state.filter==="all"||state.filter==="yesterday-board"&&Number(row.yesterdayBoardCount)>0||!ChartRequest.missing(row.auctionChangePct)&&(state.filter==="gt3"&&p>3||state.filter==="gt5"&&p>5||state.filter==="gt7"&&p>7||state.filter==="auction-limit"&&p>=9.5);
    return marketOk&&filterOk;
  });
  renderTable("stock",state.stocks);
  if(!state.stocks.some(row=>row.code===state.stock?.code)){state.stock=null;clearCharts("stock","请选择个股");$("stockSelectedState").textContent="未选择个股";$("stockSelectedState").classList.add("empty")}
  if(!state.stock&&state.stocks[0])selectStock(state.stocks[0]);
}
function loadStocks(force=false){
  if(!state.sector)return Promise.resolve();
  const sector=state.sector.code,date=state.date,source=state.stockSource,query=new URLSearchParams({sector,sectorName:state.sector.name||sector,date,source,filter:"all",market:"all",limit:"2000"});if(force)query.set("force","1");
  return requests.run("stocks",`/api/auction-management/stocks?${query}`,{
    isCurrent:()=>state.sector?.code===sector&&state.date===date&&state.stockSource===source,
    loading(){$("stockScope").textContent=`${dateLabel(date)} · 读取中`},
    success(body){if(body.date&&String(body.date).replace(/-/g,"")!==date)throw Error("个股列表交易日与当前选择不一致");state.allStocks=body.items||[];state.stockMeta=body;const coverage=body.coverage||{};$("stockScope").textContent=`${state.sector.name||sector} · ${dateLabel(body.date||date)} · ${body.total??state.allStocks.length} 只 · ${body.dataSource||body.source||"本地"} · 行情 ${coverage.realtime??"--"}/${coverage.total??state.allStocks.length}`;$("sourceNote").textContent=`股票：${sourceLabel(source)}`;applyStockView()},
    error(error){state.allStocks=[];applyStockView();$("stockScope").textContent=error.message}
  });
}
function selectSector(row){
  if(!row)return;const changed=state.sector?.code!==row.code;state.sector=row;renderTable("sector",state.sectors);
  $("sectorSelectedState").textContent=`已选板块：${row.name||row.code}`;$("sectorSelectedState").classList.remove("empty");$("sectorChartTitle").textContent=`${row.name||row.code} K线`;
  if(changed){resetStock();loadStocks();loadChart("sector",row.code);loadIntraday("sector",row.code)}
}
function selectStock(row){
  if(!row)return;const changed=state.stock?.code!==row.code;state.stock=row;renderTable("stock",state.stocks);$("stockSelectedState").textContent=`已选个股：${row.name||row.code}`;$("stockSelectedState").classList.remove("empty");$("stockChartTitle").textContent=`${row.name||row.code} K线`;
  if(changed){loadChart("stock",row.code);loadIntraday("stock",row.code)}
}
function renderIntraday(c,rows){const t=rows.map(x=>String(x.time||"").replace(/^(\d{2})(\d{2})$/,"$1:$2")),p=rows.map(x=>Number(x.price||0)),v=rows.map((x,i)=>{const previous=Number(rows[i-1]?.price??x.price??0);return{value:Number(x.volume||0),itemStyle:{color:Number(x.price||0)>=previous?"#d92d20":"#138a4b"}}});c.setOption({animation:false,grid:[{left:48,right:12,top:32,height:"61%"},{left:48,right:12,bottom:25,height:"18%"}],tooltip:{trigger:"axis"},xAxis:[{type:"category",boundaryGap:false,data:t},{type:"category",gridIndex:1,data:t,axisLabel:{show:false}}],yAxis:[{scale:true},{gridIndex:1,axisLabel:{show:false}}],series:[{type:"line",name:"价格",data:p,showSymbol:false,lineStyle:{color:"#1677ff"}},{type:"bar",name:"成交量",xAxisIndex:1,yAxisIndex:1,data:v,barMaxWidth:5}]},true);c.resize()}
function renderK(c,rows,title){const d=rows.map(x=>dateLabel(x.date)),k=rows.map(x=>[x.open,x.close,x.low,x.high]),v=rows.map(x=>({value:Number(x.volume||0),itemStyle:{color:Number(x.close)>=Number(x.open)?"#d92d20":"#138a4b"}}));c.setOption({animation:false,grid:[{left:52,right:16,top:35,height:"60%"},{left:52,right:16,bottom:27,height:"18%"}],tooltip:{trigger:"axis",confine:false,position:(point,_params,_dom,_rect,size)=>[Math.max(4,Math.min(point[0]-size.contentSize[0]/2,size.viewSize[0]-size.contentSize[0]-4)),6],axisPointer:{type:"cross"},formatter:p=>KlineTooltip.format(rows,p?.[0]?.dataIndex??0)},xAxis:[{type:"category",data:d},{type:"category",gridIndex:1,data:d,axisLabel:{show:false}}],yAxis:[{scale:true},{gridIndex:1,axisLabel:{show:false}}],dataZoom:[{type:"inside",xAxisIndex:[0,1]},{type:"slider",xAxisIndex:[0,1],height:18,bottom:1}],series:[{type:"candlestick",name:title,data:k,itemStyle:{color:"#d92d20",color0:"#138a4b",borderColor:"#d92d20",borderColor0:"#138a4b"}},{type:"bar",name:"成交量",xAxisIndex:1,yAxisIndex:1,data:v,barMaxWidth:8}]},true);c.resize()}
function loadChart(type,code,force=false){
  const date=state.date,period=state.period[type],empty=$(type+"KEmpty"),meta=$(type+"ChartMeta"),query=new URLSearchParams({code,date,period,limit:"1000"});if(force)query.set("force","1");
  return requests.run(type+"-kline",`/api/market-management/${type}-kline?${query}`,{
    isCurrent:()=>state.date===date&&state.period[type]===period&&state[type]?.code===code,
    loading({refresh}){if(refresh)return;charts[type].clear();empty.textContent="K线加载中";empty.classList.remove("hidden");meta.textContent=`${dateLabel(date)} · 读取中`},
    success(body){if(!body.items?.length)throw Error(body.error||"暂无 K 线数据");if(body.items.some(row=>String(row.date).replace(/-/g,"")>date))throw Error("K线日期与当前选择不一致");renderK(charts[type],body.items,type==="sector"?"板块K线":"个股K线");empty.classList.add("hidden");meta.textContent=`${body.source||"本地"} · 截至 ${dateLabel(body.items.at(-1).date)}`},
    error(error){charts[type].clear();empty.textContent=error.message;empty.classList.remove("hidden");meta.textContent=`${dateLabel(date)} · 未获取数据`}
  });
}
function loadIntraday(type,code,force=false){
  const date=state.date,empty=$(type+"IntradayEmpty"),meta=$(type+"IntradayMeta"),query=new URLSearchParams({code,date,kind:type});if(force)query.set("force","1");
  return requests.run(type+"-intraday",`/api/market-management/intraday?${query}`,{
    isCurrent:()=>state.date===date&&state[type]?.code===code,
    loading({refresh}){if(refresh)return;charts[type+"Intraday"].clear();empty.textContent="分时加载中";empty.classList.remove("hidden");meta.textContent=`${dateLabel(date)} · 读取中`},
    success(body){if(!body.items?.length)throw Error(body.error||`${dateLabel(date)} 暂无分时数据`);if(body.date&&String(body.date).replace(/-/g,"")!==date)throw Error("分时日期与当前选择不一致");renderIntraday(charts[type+"Intraday"],body.items);empty.classList.add("hidden");meta.textContent=`${dateLabel(date)} · ${body.source||"本地"}`},
    error(error){charts[type+"Intraday"].clear();empty.textContent=error.message;empty.classList.remove("hidden");meta.textContent=`${dateLabel(date)} · 未获取数据`}
  });
}
function openFields(n){state.editing=n;$("fieldOptions").innerHTML=fields[n].map(f=>`<label class="field-option"><input type="checkbox" data-field="${f.key}" ${enabled(n).includes(f.key)?"checked":""}>${f.label}</label>`).join("");$("fieldDialog").showModal()}$("closeDialog").onclick=()=>$("fieldDialog").close();$("applyFields").onclick=()=>{persist({[`auction-fields-${state.editing}`]:[...$("fieldOptions").querySelectorAll("input:checked")].map(x=>x.dataset.field)});$("fieldDialog").close();renderTable(state.editing,state.editing==="sector"?state.sectors:state.stocks)};$("resetFields").onclick=()=>{persist({[`auction-fields-${state.editing}`]:defaults[state.editing]});$("fieldDialog").close();renderTable(state.editing,state.editing==="sector"?state.sectors:state.stocks)};
function initLayout(){const l=state.preferences.layout||{};Split(["#topRow","#bottomRow"],{direction:"vertical",sizes:Array.isArray(l.auctionVertical)?l.auctionVertical:[45,55],minSize:[240,280],gutterSize:7,onDragEnd:s=>persist({layout:{...state.preferences.layout,auctionVertical:s}})});Split(["#sectorPane","#sectorKPane","#sectorIntradayPane"],{sizes:Array.isArray(l.auctionTop)?l.auctionTop:[34,33,33],minSize:[280,320,280],gutterSize:7,onDragEnd:s=>persist({layout:{...state.preferences.layout,auctionTop:s}})});Split(["#stockPane","#stockKPane","#stockIntradayPane"],{sizes:Array.isArray(l.auctionBottom)?l.auctionBottom:[38,31,31],minSize:[360,320,280],gutterSize:7,onDragEnd:s=>persist({layout:{...state.preferences.layout,auctionBottom:s}})});}
document.querySelectorAll("[data-fields]").forEach(button=>button.onclick=()=>openFields(button.dataset.fields));
document.querySelectorAll("[data-filter],[data-market]").forEach(button=>button.onclick=()=>{const key=button.dataset.filter!==undefined?"filter":"market";state[key]=button.dataset[key];document.querySelectorAll(`[data-${key}]`).forEach(item=>item.classList.toggle("active",item===button));applyStockView()});
document.querySelectorAll("[data-source]").forEach(button=>button.onclick=()=>{const source=button.dataset.source;if(source===state.stockSource)return;state.stockSource=source;resetStock();persist({"auction-stock-source":source});document.querySelectorAll("[data-source]").forEach(item=>{const active=item.dataset.source===source;item.classList.toggle("active",active);item.setAttribute("aria-selected",String(active))});loadStatus();loadStocks()});
document.querySelectorAll("[data-chart]").forEach(button=>button.onclick=()=>{const type=button.dataset.chart,period=button.dataset.period;if(period===state.period[type])return;state.period[type]=period;persist({[`auction-period-${type}`]:period});document.querySelectorAll(`[data-chart="${type}"]`).forEach(item=>item.classList.toggle("active",item===button));if(state[type])loadChart(type,state[type].code)});
$("auctionDate").onchange=()=>{state.date=$("auctionDate").value;persist({"auction-date":state.date});requests.cancelAll();state.sector=null;resetStock();clearCharts("sector","请选择板块");loadSectors()};
async function refresh(force=false){const previous=state.sector?.code;await loadSectors(force);if(previous&&state.sector?.code===previous)await loadStocks(force);await refreshCharts(force)}
$("refreshButton").onclick=()=>refresh(false);$("updateButton").onclick=()=>refresh(true);
window.onresize=()=>Object.values(charts).forEach(chart=>chart.resize());
function todayKey(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).replace(/-/g,"")}
function marketLive(){const parts=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(part=>[part.type,part.value])),minutes=Number(parts.hour)*60+Number(parts.minute);return !["Sat","Sun"].includes(parts.weekday)&&minutes>=555&&minutes<=900}
async function refreshCharts(force=false){const jobs=[];for(const type of ["sector","stock"])if(state[type])jobs.push(loadChart(type,state[type].code,force),loadIntraday(type,state[type].code,force));await Promise.all(jobs)}
let liveBusy=false;
setInterval(async()=>{if(liveBusy||document.hidden||state.date!==todayKey()||!marketLive())return;liveBusy=true;try{await refresh()}finally{liveBusy=false}},15000);
(async()=>{try{
  await loadPrefs();const source=state.preferences["auction-stock-source"];if(["mx","cmes","sina","tencent"].includes(source))state.stockSource=source;
  document.querySelectorAll("[data-source]").forEach(button=>{const active=button.dataset.source===state.stockSource;button.classList.toggle("active",active);button.setAttribute("aria-selected",String(active))});
  initLayout();for(const type of ["sector","stock"]){const period=state.preferences[`auction-period-${type}`];if(["daily","weekly","monthly"].includes(period)){state.period[type]=period;document.querySelectorAll(`[data-chart="${type}"]`).forEach(button=>button.classList.toggle("active",button.dataset.period===period))}}
  await loadDates();loadStatus();await loadSectors();
}catch(error){$("dataStatus").textContent=error.message}})();
});
</script></body></html>

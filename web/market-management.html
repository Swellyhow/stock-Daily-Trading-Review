<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市场管理工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
  <style>
    :root { --bg:#f5f7fa; --surface:#fff; --soft:#f8fafc; --text:#101828; --muted:#667085; --line:#e4e7ec; --primary:#1677ff; --primary-soft:#eaf3ff; --up:#d92d20; --down:#138a4b; --warn:#b54708; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; min-width:320px; color:var(--text); background:var(--bg); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    body { overflow:hidden; }
    button,input,select { font:inherit; }
    .topbar { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; color:#fff; background:#162033; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:5px; color:#fff; background:var(--primary); font-weight:800; }
    h1 { margin:0; font-size:18px; }
    .topnav { display:flex; gap:24px; }
    .topnav a { color:#d0d5dd; text-decoration:none; font-size:13px; }
    .topnav a:hover,.topnav a.active { color:#fff; }
    .toolbar { height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 16px; border-bottom:1px solid var(--line); background:#fff; }
    .toolbar-left,.toolbar-right { display:flex; align-items:center; gap:9px; }
    .toolbar-title { font-weight:700; font-size:14px; }
    .toolbar-note { color:var(--muted); font-size:12px; }
    .button { height:30px; padding:0 10px; border:1px solid #d0d5dd; border-radius:4px; color:#344054; background:#fff; cursor:pointer; font-size:12px; font-weight:600; }
    .button:hover { border-color:var(--primary); color:var(--primary); }
    .button.primary { border-color:var(--primary); color:#fff; background:var(--primary); }
    .date-filter { display:flex; align-items:center; gap:6px; color:#475467; font-size:12px; }
    .date-select { height:30px; min-width:126px; padding:0 26px 0 9px; border:1px solid #d0d5dd; border-radius:4px; color:#344054; background:#fff; cursor:pointer; }
    .layout { position:relative; height:calc(100vh - 112px); min-height:420px; display:flex; flex-direction:column; }
    .split-row { display:flex; min-height:0; min-width:0; }
    #topRow,#bottomRow { width:100%; }
    #topRow { min-height:270px; }
    #bottomRow { min-height:300px; }
    .pane { min-width:0; min-height:0; overflow:hidden; background:var(--surface); }
    .pane-head { height:45px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 12px; border-bottom:1px solid var(--line); }
    .pane-title { display:flex; align-items:baseline; gap:8px; min-width:0; }
    .pane-title strong { font-size:14px; white-space:nowrap; }
    .pane-title span { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pane-actions { display:flex; align-items:center; gap:7px; }
    .field-btn { height:26px; padding:0 8px; border:1px solid var(--line); border-radius:4px; color:var(--muted); background:#fff; cursor:pointer; font-size:11px; }
    .field-btn:hover { color:var(--primary); border-color:var(--primary); }
    .table-holder { height:calc(100% - 45px); min-height:0; }
    .chart-holder { position:relative; height:calc(100% - 45px); min-height:0; }
    .chart-panel { position:relative; min-width:0; min-height:0; height:calc(100% - 45px); overflow:hidden; }
     .period-tabs { display:flex; align-items:center; gap:2px; }
     .period-tab { height:25px; padding:0 8px; border:1px solid transparent; border-radius:3px; color:var(--muted); background:transparent; cursor:pointer; font-size:11px; }
     .period-tab:hover { color:var(--primary); border-color:#b2ddff; }
     .period-tab.active { color:var(--primary); border-color:#b2ddff; background:var(--primary-soft); font-weight:700; }
    .chart-label { position:absolute; top:7px; left:10px; z-index:2; color:#475467; font-size:11px; font-weight:700; pointer-events:none; }
    .chart { width:100%; height:100%; }
    /* Chart placeholders are full-panel overlays. Keep this class separate from
       the compact empty selection badges in the pane headers. */
    .chart-empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:12px; pointer-events:none; }
    .hidden { display:none !important; }
    .date-loading { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; gap:9px; color:#175cd3; background:rgba(255,255,255,.78); backdrop-filter:blur(1px); font-size:13px; font-weight:600; pointer-events:all; }
    .date-loading::before { content:""; width:16px; height:16px; border:2px solid #b2ccff; border-top-color:var(--primary); border-radius:50%; animation:date-spin .75s linear infinite; }
    @keyframes date-spin { to { transform:rotate(360deg); } }
    .tabs { display:flex; align-items:center; gap:3px; padding:7px 10px 0; border-bottom:1px solid var(--line); background:#fff; }
    .tab { position:relative; height:29px; padding:0 11px; border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:12px; }
    .tab.active { color:var(--primary); font-weight:700; }
    .tab.active::after { content:""; position:absolute; right:8px; bottom:-1px; left:8px; height:2px; background:var(--primary); }
    .filter-count { display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:16px; margin-left:5px; padding:0 4px; border:1px solid #d0d5dd; border-radius:8px; color:#667085; background:#f8fafc; font-size:10px; font-weight:600; line-height:1; }
    .tab.active .filter-count { border-color:#b2ccff; color:#175cd3; background:#eff4ff; }
    .stock-tools { height:42px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 10px; border-bottom:1px solid var(--line); }
    .stock-tabs { display:flex; gap:2px; }
    .market-tabs { display:flex; gap:2px; }
    .stock-body { height:calc(100% - 87px); min-height:0; }
    .tabulator { height:100%; min-width:0; border:0; font-size:11px; background:#fff; }
    .tabulator .tabulator-row, .tabulator .tabulator-cell { user-select:none; -webkit-user-select:none; }
    .tabulator .tabulator-header { border-bottom:1px solid var(--line); background:var(--soft); }
    .tabulator .tabulator-header .tabulator-col { height:34px; color:#475467; border-right:1px solid #eef1f5; background:var(--soft); }
    .tabulator .tabulator-header .tabulator-col .tabulator-col-content { padding:9px 7px; }
    .tabulator .tabulator-row { min-height:34px; border-bottom:1px solid #f0f2f5; }
    .tabulator .tabulator-row .tabulator-cell { padding:7px; border-right:1px solid #f8fafc; }
    .tabulator .tabulator-row:hover { background:#f5f9ff; }
    .tabulator .tabulator-row.tabulator-selected { background:var(--primary-soft); box-shadow:inset 3px 0 0 var(--primary); }
    .tabulator .tabulator-row.tabulator-selected .tabulator-cell { color:#0b5bd3; font-weight:600; }
    .selection-state { display:inline-flex; align-items:center; max-width:220px; min-height:22px; padding:0 7px; border:1px solid #b2ddff; border-radius:4px; color:#0958d9; background:#eff8ff; font-size:11px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .selection-state.is-empty { border-color:var(--line); color:var(--muted); background:var(--soft); font-weight:500; }
    .up { color:var(--up); } .down { color:var(--down); }
    .market-badge { display:inline-flex; padding:2px 4px; border:1px solid #d0d5dd; border-radius:3px; color:#475467; background:#f8fafc; font-size:10px; }
    .limit-type-list { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }
    .limit-type-tag { display:inline-flex; padding:2px 4px; border:1px solid #f3b4b4; border-radius:3px; color:#b42318; background:#fff5f5; font-size:10px; white-space:nowrap; }
    .gutter { background:#e7ebf0; background-repeat:no-repeat; background-position:center; z-index:5; }
    .gutter:hover { background-color:#b7c8df; }
    .gutter-horizontal { width:7px; cursor:col-resize; background-image:linear-gradient(90deg,transparent 2px,#98a2b3 2px,#98a2b3 5px,transparent 5px); }
    .gutter-vertical { height:7px; cursor:row-resize; background-image:linear-gradient(0deg,transparent 2px,#98a2b3 2px,#98a2b3 5px,transparent 5px); }
    dialog { width:min(420px,calc(100vw - 28px)); padding:0; border:0; border-radius:6px; box-shadow:0 16px 40px rgba(16,24,40,.2); }
    dialog::backdrop { background:rgba(16,24,40,.35); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
    .dialog-head strong { font-size:15px; }
    .dialog-body { display:grid; gap:10px; max-height:55vh; overflow:auto; padding:14px 16px; }
    .field-option { display:flex; align-items:center; gap:8px; color:#344054; font-size:13px; }
    .field-option input { accent-color:var(--primary); }
    .dialog-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
    @media (max-width:900px) { .topbar { padding:0 12px; } .topnav { display:none; } .toolbar-note { display:none; } }
     @media (max-width:700px) { body { overflow:auto; } .layout { height:auto; min-height:1400px; } #topRow,#bottomRow { min-height:660px; } .pane { min-height:220px; } .stock-tools { flex-wrap:wrap; height:68px; } .stock-body { height:calc(100% - 113px); } .tabs { overflow:auto; } .period-tabs { gap:0; } .period-tab { padding:0 6px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">管</div><h1>市场管理工作台</h1></div>
    <nav class="topnav" aria-label="数据页面导航">
<a href="./auction-monitor.html">竞价监控</a><a class="active" href="./market-management.html">市场管理</a><a href="./limit-up-ladder.html">连板天梯</a><a href="./custom-sector-tracker.html">板块自定义追踪</a><a href="./data-viewer.html">市场数据</a><a href="./history-viewer.html">历史数据</a><a href="./key-management.html">密钥管理</a>
    </nav>
  </header>
  <div class="toolbar">
    <div class="toolbar-left"><span class="toolbar-title">概念板块联动</span><span class="toolbar-note">stockdb 本地行情</span></div>
    <div class="toolbar-right"><label class="date-filter" for="chartDate">交易日期<select class="date-select" id="chartDate" aria-label="交易日期"></select></label><span class="toolbar-note" id="dataStatus">正在连接 stockdb</span><button class="button" id="refreshButton" type="button">读取 stockdb</button><button class="button primary" id="updateButton" type="button">重新读取</button></div>
  </div>

  <main class="layout" id="verticalLayout">
    <div class="date-loading hidden" id="dateLoading" role="status" aria-live="polite"></div>
    <section class="split-row" id="topRow">
      <article class="pane" id="sectorPane">
        <div class="pane-head"><div class="pane-title"><strong>板块信息</strong><span id="sectorCount">概念板块</span><span class="toolbar-note" title="板块统计由 stockdb 概念成分与最近交易日日 K 计算">统计口径：stockdb</span><span id="sectorSelectedState" class="selection-state is-empty">未选择板块</span></div><div class="pane-actions"><button class="field-btn" data-table="sector" type="button">字段设置</button></div></div>
        <div class="table-holder"><div id="sectorTable"></div></div>
      </article>
      <article class="pane" id="sectorKPane">
         <div class="pane-head"><div class="pane-title"><strong id="sectorChartTitle">板块K线</strong><span id="sectorChartMeta">请选择左侧板块</span></div><div class="pane-actions"><div class="period-tabs" role="tablist" aria-label="板块K线周期"><button class="period-tab active" data-chart-type="sector" data-period="daily" type="button">日K</button><button class="period-tab" data-chart-type="sector" data-period="weekly" type="button">周K</button><button class="period-tab" data-chart-type="sector" data-period="monthly" type="button">月K</button></div></div></div>
         <div class="chart-panel" id="sectorKChartPanel"><span class="chart-label" id="sectorKLabel">日K · 悬停查看数据，点击切换分时</span><div class="chart" id="sectorChart"></div><div class="chart-empty" id="sectorEmpty">选择概念板块查看走势</div></div>
      </article>
      <article class="pane" id="sectorIntradayPane">
         <div class="pane-head"><div class="pane-title"><strong>板块分时</strong><span id="sectorIntradayMeta">请选择左侧板块</span></div></div>
         <div class="chart-panel" id="sectorIntradayPanel"><span class="chart-label" id="sectorIntradayLabel">分时</span><div class="chart" id="sectorIntradayChart"></div><div class="chart-empty" id="sectorIntradayEmpty">选择概念板块查看分时</div></div>
      </article>
    </section>
    <section class="split-row" id="bottomRow">
      <article class="pane" id="stockPane">
        <div class="pane-head"><div class="pane-title"><strong>个股信息</strong><span id="stockScope">请先选择板块</span><span id="stockSelectedState" class="selection-state is-empty">未选择个股</span></div><div class="pane-actions"><button class="field-btn" data-table="stock" type="button">字段设置</button></div></div>
        <div class="stock-tools">
          <div class="stock-tabs" role="tablist" aria-label="涨跌分类"><button class="tab active" data-tab="all" role="tab" type="button">全部<span class="filter-count" data-tab-count="all">--</span></button><button class="tab" data-tab="up" role="tab" title="按 stockdb 日 K 前收盘价和市场涨跌幅限制计算" type="button">涨停<span class="filter-count" data-tab-count="up">--</span></button><button class="tab" data-tab="down" role="tab" type="button">跌停<span class="filter-count" data-tab-count="down">--</span></button></div>
          <div class="market-tabs" role="tablist" aria-label="上市板块"><button class="tab active" data-market="all" role="tab" type="button">全部<span class="filter-count" data-market-count="all">--</span></button><button class="tab" data-market="main" role="tab" type="button">主板<span class="filter-count" data-market-count="main">--</span></button><button class="tab" data-market="创业板" role="tab" type="button">创业板<span class="filter-count" data-market-count="创业板">--</span></button><button class="tab" data-market="科创板" role="tab" type="button">科创板<span class="filter-count" data-market-count="科创板">--</span></button><button class="tab" data-market="京A" role="tab" type="button">京A<span class="filter-count" data-market-count="京A">--</span></button></div>
        </div>
        <div class="stock-body"><div id="stockTable"></div></div>
      </article>
      <article class="pane" id="stockKPane">
         <div class="pane-head"><div class="pane-title"><strong id="stockChartTitle">个股K线</strong><span id="stockChartMeta">请选择左下方股票</span></div><div class="pane-actions"><div class="period-tabs" role="tablist" aria-label="个股K线周期"><button class="period-tab active" data-chart-type="stock" data-period="daily" type="button">日K</button><button class="period-tab" data-chart-type="stock" data-period="weekly" type="button">周K</button><button class="period-tab" data-chart-type="stock" data-period="monthly" type="button">月K</button></div></div></div>
         <div class="chart-panel" id="stockKChartPanel"><span class="chart-label" id="stockKLabel">日K · 悬停查看数据，点击切换分时</span><div class="chart" id="stockChart"></div><div class="chart-empty" id="stockEmpty">选择个股查看走势</div></div>
      </article>
      <article class="pane" id="stockIntradayPane">
         <div class="pane-head"><div class="pane-title"><strong>个股分时</strong><span id="stockIntradayMeta">请选择左下方股票</span></div></div>
         <div class="chart-panel" id="stockIntradayPanel"><span class="chart-label" id="stockIntradayLabel">分时</span><div class="chart" id="stockIntradayChart"></div><div class="chart-empty" id="stockIntradayEmpty">选择个股查看分时</div></div>
      </article>
    </section>
  </main>

  <dialog id="fieldDialog"><div class="dialog-head"><strong>字段设置</strong><button class="field-btn" id="closeDialog" type="button">关闭</button></div><div class="dialog-body" id="fieldOptions"></div><div class="dialog-foot"><button class="button" id="resetFields" type="button">恢复默认</button><button class="button primary" id="applyFields" type="button">应用</button></div></dialog>

  <style>.echarts-tooltip{font-size:11px!important;line-height:14px!important}.chart-panel{overflow:visible}.pane:has(.chart-panel){overflow:visible}</style>
  <script src="./kline-tooltip.js?v=4"></script>
  <script src="./chart-request.js?v=1"></script>
  <script>
    const state = { demo: new URLSearchParams(location.search).get("demo") === "1", selectedSector: null, selectedStock: null, tab: "all", market: "all", editingTable: null, preferences: {}, chartDate: "", stockDataDate: "", tradingDates: [], chartPeriods:{sector:"daily",stock:"daily"}, dateRequestId:0 };
    const chartRequests = ChartRequest.createLatestRequests();
    const chartRequestId = {sector:0, stock:0};
    const klineRequestId = {sector:0, stock:0};
    let sectorRequestId = 0;
    let stocksRequestId = 0;
    let stockDetailsRequestId = 0;
    let stockDetailsTimer = 0;
    let stockDetailsSector = "";
    const stockDetailsLoaded = new Set();
    const stockDetailsPending = new Set();
    const $ = (id) => document.getElementById(id);
    const reviewButton = document.createElement("button"); reviewButton.className = "button"; reviewButton.id = "reviewSyncButton"; reviewButton.type = "button"; reviewButton.textContent = "补充涨停原因"; $("updateButton").before(reviewButton);
    const fieldStore = (name) => `market-management-fields-${name}`;
    const columnStore = (name) => `market-management-columns-${name}`;
    const sectorFields = [
      { title:"序号", field:"rowNumber", width:58, minWidth:48, widthGrow:0, widthShrink:0, headerSort:false, formatter:indexFormatter }, { title:"板块名称", field:"name", width:130, minWidth:90, widthGrow:2, widthShrink:1, responsive:0 }, { title:"涨幅", field:"changePct", width:68, minWidth:58, widthGrow:1, widthShrink:1, responsive:0, formatter: pctFormatter }, { title:"涨家数", field:"upCount", width:65, minWidth:55, widthGrow:1, widthShrink:1, responsive:1 }, { title:"跌家数", field:"downCount", width:65, minWidth:55, widthGrow:1, widthShrink:1, responsive:1 }, { title:"涨停数", field:"limitUpCount", width:65, minWidth:55, widthGrow:1, widthShrink:1, responsive:1 }, { title:"跌停数", field:"limitDownCount", width:65, minWidth:55, widthGrow:1, widthShrink:1, responsive:1 }, { title:"最低价时间", field:"lowPriceTime", width:90, minWidth:78, widthGrow:1, widthShrink:1, responsive:2 }, { title:"最高价时间", field:"highPriceTime", width:90, minWidth:78, widthGrow:1, widthShrink:1, responsive:2 }, { title:"起涨时间", field:"startTime", width:82, minWidth:72, widthGrow:1, widthShrink:1, responsive:2 }, { title:"起跌时间", field:"fallTime", width:82, minWidth:72, widthGrow:1, widthShrink:1, responsive:2 }, { title:"板块新闻", field:"news", width:140, minWidth:100, widthGrow:2, widthShrink:1, responsive:3 }
    ];
    const stockFields = [
      { title:"序号", field:"rowNumber", width:58, minWidth:48, widthGrow:0, widthShrink:0, headerSort:false, formatter:indexFormatter }, { title:"个股名称", field:"name", width:118, minWidth:90, widthGrow:2, widthShrink:1, responsive:0 }, { title:"涨幅", field:"changePct", width:68, minWidth:58, widthGrow:1, widthShrink:1, responsive:0, formatter:pctFormatter }, { title:"现价", field:"latestPrice", width:70, minWidth:62, widthGrow:1, widthShrink:1, responsive:1, formatter:priceFormatter }, { title:"主力金额", field:"mainAmount", width:92, minWidth:80, widthGrow:1, widthShrink:1, responsive:2, formatter:amountFormatter }, { title:"换手率", field:"turnoverPct", width:70, minWidth:62, widthGrow:1, widthShrink:1, responsive:1, formatter:pctFormatter }, { title:"上市交易所", field:"marketType", width:88, minWidth:78, widthGrow:1, widthShrink:1, responsive:1, formatter:marketFormatter }, { title:"涨停类型", field:"limitTypes", width:150, minWidth:105, widthGrow:2, widthShrink:1, responsive:1, formatter:limitTypesFormatter }, { title:"涨停原因", field:"limitReason", width:150, minWidth:110, widthGrow:2, widthShrink:1, responsive:1 }, { title:"最低价时间", field:"lowPriceTime", width:90, minWidth:78, widthGrow:1, widthShrink:1, responsive:2 }, { title:"最高价时间", field:"highPriceTime", width:90, minWidth:78, widthGrow:1, widthShrink:1, responsive:2 }, { title:"起涨时间", field:"startTime", width:82, minWidth:72, widthGrow:1, widthShrink:1, responsive:2 }, { title:"起跌时间", field:"fallTime", width:82, minWidth:72, widthGrow:1, widthShrink:1, responsive:2 }, { title:"涨停时间", field:"limitUpTime", width:82, minWidth:72, widthGrow:1, widthShrink:1, responsive:2 }, { title:"跌停时间", field:"limitDownTime", width:82, minWidth:78, widthGrow:1, widthShrink:1, responsive:2 }, { title:"流通市值", field:"circulatingMarketCap", width:100, minWidth:88, widthGrow:1, widthShrink:1, responsive:2, formatter:amountFormatter }, { title:"总市值", field:"totalMarketCap", width:100, minWidth:88, widthGrow:1, widthShrink:1, responsive:2, formatter:amountFormatter }, { title:"概念板块起涨时间", field:"sectorStartTime", width:118, minWidth:100, widthGrow:1, widthShrink:1, responsive:3 }, { title:"股票新闻", field:"news", width:140, minWidth:100, widthGrow:2, widthShrink:1, responsive:3 }
    ];

    async function loadIntraday(type, code, date, force = false, requestToken = state.dateRequestId) {

      } catch { state.tradingDates = []; state.chartDate = ""; $("chartDate").innerHTML = ""; }
    }
    const sectorChart = echarts.init($("sectorChart")); const stockChart = echarts.init($("stockChart"));
    const sectorIntradayChart = echarts.init($("sectorIntradayChart")); const stockIntradayChart = echarts.init($("stockIntradayChart"));
    let sectorTable; let stockTable; let verticalSplit; let topSplit; let bottomSplit; const columnSaveTimers = {};
    function validSizes(value, fallback) { return Array.isArray(value) && value.length === fallback.length && value.every((item) => Number.isFinite(Number(item)) && Number(item) > 0) ? value.map(Number) : fallback; }
    function persistPreferences(patch) { state.preferences = {...state.preferences, ...patch}; fetch("/api/market-management/preferences", { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({preferences:patch}) }).catch(() => {}); }
    async function loadPreferences() { try { const body = await getJson("/api/market-management/preferences"); state.preferences = body.preferences && typeof body.preferences === "object" ? body.preferences : {}; } catch { state.preferences = {}; } }
    function migrateTimeFields() {
      if (Number(state.preferences["time-fields-version"] || 0) >= 4) return;
      const patch = {"time-fields-version":4};
      for (const [name, defs] of [["sector", sectorFields], ["stock", stockFields]]) {
        const key = `fields-${name}`;
        const saved = Array.isArray(state.preferences[key]) ? state.preferences[key] : (() => { try { return JSON.parse(localStorage.getItem(fieldStore(name)) || "null"); } catch { return null; } })();

        const fields = defs.map((def) => def.field).filter((field) => enabled.has(field));
        if (name === "stock" && !fields.includes("limitTypes")) fields.push("limitTypes");
        if (name === "stock" && !fields.includes("limitReasonDetail")) fields.push("limitReasonDetail");
        patch[key] = fields;
        state.preferences[key] = fields;
        localStorage.setItem(fieldStore(name), JSON.stringify(fields));

    function restoreChartPeriods() {
      for (const type of ["sector", "stock"]) {
        const period = state.preferences[`chart-period-${type}`];
        if (["daily", "weekly", "monthly"].includes(period)) {

          document.querySelectorAll(`[data-chart-type="${type}"]`).forEach((button) => button.classList.toggle("active", button.dataset.period === period));
        }

    function initLayout() { const layout = state.preferences.layout || {}; verticalSplit = Split(["#topRow","#bottomRow"],{direction:"vertical",sizes:validSizes(layout.vertical,[45,55]),minSize:[240,280],gutterSize:7,onDragEnd:(sizes)=>{ persistPreferences({layout:{...state.preferences.layout,vertical:sizes}}); redrawTables(); }}); topSplit = Split(["#sectorPane","#sectorKPane","#sectorIntradayPane"],{direction:"horizontal",sizes:validSizes(layout.top,[34,33,33]),minSize:[300,360,300],gutterSize:7,onDragEnd:(sizes)=>{ persistPreferences({layout:{...state.preferences.layout,top:sizes}}); redrawTables(); }}); bottomSplit = Split(["#stockPane","#stockKPane","#stockIntradayPane"],{direction:"horizontal",sizes:validSizes(layout.bottom,[34,33,33]),minSize:[360,360,300],gutterSize:7,onDragEnd:(sizes)=>{ persistPreferences({layout:{...state.preferences.layout,bottom:sizes}}); redrawTables(); }}); requestAnimationFrame(() => { sectorChart.resize(); stockChart.resize(); sectorIntradayChart.resize(); stockIntradayChart.resize(); }); }

    $("closeDialog").addEventListener("click",()=>$("fieldDialog").close()); $("applyFields").addEventListener("click",()=>applyFields(false)); $("resetFields").addEventListener("click",()=>applyFields(true)); $("refreshButton").addEventListener("click",()=>loadSectors(false)); $("updateButton").addEventListener("click",()=>loadSectors(true)); $("chartDate").addEventListener("change",(event)=>setChartDate(event.target.value, true));

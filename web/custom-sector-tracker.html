<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板块自定义追踪</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--soft:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#1677ff;--primary-soft:#eaf3ff;--up:#d92d20;--up-soft:#fff1f0;--down:#138a4b;--down-soft:#ecfdf3;--nav:#162033;--shadow:0 8px 24px #1018280d}
*{box-sizing:border-box}html,body{height:100%;min-width:320px;margin:0;color:var(--text);background:var(--bg);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{overflow:auto}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px;background:var(--nav);color:#fff}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:5px;background:var(--primary);font-weight:800}.brand h1{margin:0;font-size:18px}.topnav{display:flex;align-items:center;gap:22px;overflow:auto}.topnav a{color:#d0d5dd;text-decoration:none;font-size:13px;white-space:nowrap}.topnav a:hover,.topnav a.active{color:#fff}.page{padding:16px 20px 32px}.page-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px}.page-intro h2{margin:0 0 5px;font-size:20px;letter-spacing:0}.page-intro p{margin:0;color:var(--muted);font-size:12px}.intro-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}.button{height:32px;padding:0 11px;border:1px solid #d0d5dd;border-radius:4px;background:var(--surface);color:#344054;font-size:12px;font-weight:600}.button:hover{border-color:var(--primary);color:var(--primary)}.button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.button.danger:hover{border-color:var(--up);color:var(--up)}.date-panel,.filter-panel,.panel{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}.date-panel{padding:11px 12px 12px;margin-bottom:10px}.section-label{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:#344054;font-size:12px;font-weight:700}.section-label small{color:var(--muted);font-size:11px;font-weight:400}.date-strip{display:flex;align-items:center;gap:7px}.scroll-btn{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:#475467;font-size:16px;line-height:1}.scroll-btn:hover{border-color:var(--primary);color:var(--primary)}.date-viewport{min-width:0;overflow:hidden}.date-list{display:flex;gap:6px;min-width:max-content;overflow-x:auto;scrollbar-width:thin;scroll-behavior:smooth;padding-bottom:2px}.date-list::-webkit-scrollbar{height:4px}.date-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}.date-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:92px;height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#475467;white-space:nowrap}.date-item:hover{border-color:#84caff;color:var(--primary)}.date-item strong{font-size:12px}.date-item span{font-size:10px;color:var(--muted)}.date-item.active{border-color:var(--primary);background:var(--primary-soft);color:#0958d9;box-shadow:inset 0 0 0 1px var(--primary)}.date-item.active span{color:#175cd3}.date-item.today strong{color:#0958d9}.filter-panel{display:flex;align-items:flex-start;gap:22px;padding:11px 12px;margin-bottom:14px}.filter-group{display:flex;align-items:center;gap:3px;min-width:0}.filter-name{margin-right:5px;color:var(--muted);font-size:11px;white-space:nowrap}.seg{height:27px;padding:0 10px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap}.seg:hover{color:var(--primary)}.seg.active{border-color:#b2ddff;background:var(--primary-soft);color:#0958d9;font-weight:700}.seg.up.active{border-color:#f3b4b4;background:var(--up-soft);color:var(--up)}.seg.down.active{border-color:#a6e2c4;background:var(--down-soft);color:var(--down)}.tag-row{display:flex;align-items:center;gap:5px;min-width:0;overflow:auto}.tag{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:3px;background:#fff;color:#475467;font-size:11px;white-space:nowrap}.tag:hover{border-color:var(--primary);color:var(--primary)}.tag.active{border-color:#b2ddff;background:var(--primary-soft);color:#0958d9;font-weight:700}.tag-add{width:27px;padding:0;font-size:16px;line-height:1}.workspace{display:grid;grid-template-columns:minmax(380px,42%) minmax(0,58%);gap:10px;min-height:560px}.panel{min-width:0;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}.panel-title{display:flex;align-items:baseline;gap:8px;min-width:0}.panel-title strong{font-size:14px;white-space:nowrap}.panel-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.panel-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}.panel-actions .button{height:28px;padding:0 9px;font-size:11px}.table-wrap{height:calc(100% - 52px);overflow:auto}table{width:100%;min-width:900px;border-collapse:separate;border-spacing:0;color:#344054;font-size:11px;white-space:nowrap}thead{position:sticky;top:0;z-index:2;background:var(--soft)}th,td{height:36px;padding:0 8px;border-right:1px solid #f2f4f7;border-bottom:1px solid #eef1f5;text-align:left}th{color:#475467;font-weight:700}tbody tr[data-id]{cursor:pointer}tbody tr[data-id]:hover{background:#f5f9ff}tbody tr.selected{background:var(--primary-soft);box-shadow:inset 3px 0 var(--primary)}tbody tr.selected td{color:#0958d9;font-weight:600}.name-cell{display:flex;align-items:center;gap:6px}.direction{display:inline-flex;padding:2px 5px;border:1px solid #f3b4b4;border-radius:3px;background:var(--up-soft);color:var(--up);font-size:10px}.direction.down{border-color:#a6e2c4;background:var(--down-soft);color:var(--down)}.sample-badge{display:inline-flex;padding:1px 4px;border:1px solid #fedf89;border-radius:3px;background:#fffaeb;color:#b54708;font-size:9px}.stock-empty,.table-empty{padding:28px 16px;color:var(--muted);text-align:center}.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.badge{display:inline-flex;padding:2px 5px;border:1px solid #d0d5dd;border-radius:3px;background:var(--soft);font-size:10px}.money{font-variant-numeric:tabular-nums}.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:min(360px,calc(100vw - 40px));padding:10px 13px;border:1px solid #b2ddff;border-radius:4px;background:#eff8ff;color:#0958d9;box-shadow:0 8px 20px #1018281a;font-size:12px}.toast.error{border-color:#f3b4b4;background:var(--up-soft);color:var(--up)}.hidden{display:none!important}dialog{width:min(620px,calc(100vw - 28px));padding:0;border:0;border-radius:6px;box-shadow:0 16px 40px #10182833}dialog::backdrop{background:#10182859}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.dialog-head strong{font-size:14px}.dialog-foot{justify-content:flex-end;gap:8px;border-top:1px solid var(--line);border-bottom:0}.dialog-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:62vh;overflow:auto;padding:14px 16px}.form-field{display:grid;gap:5px;min-width:0}.form-field.wide{grid-column:1/-1}.form-field label{color:#475467;font-size:11px;font-weight:600}.form-field input,.form-field select{height:31px;width:100%;padding:0 8px;border:1px solid #d0d5dd;border-radius:4px;background:#fff;color:#344054;font-size:12px}.form-field input:focus,.form-field select:focus{border-color:var(--primary);outline:2px solid #b2ddff;outline-offset:-1px}.tag-dialog{width:min(430px,calc(100vw - 28px))}.tag-add-form{display:flex;gap:7px;margin-bottom:12px}.tag-add-form input{height:31px;flex:1;padding:0 8px;border:1px solid #d0d5dd;border-radius:4px;font-size:12px}.tag-list{display:grid;gap:7px;max-height:45vh;overflow:auto}.tag-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:4px}.tag-line span{font-size:12px}.tag-line .button{height:26px;padding:0 8px;font-size:11px}.tag-line-actions{display:flex;gap:5px}@media(max-width:1050px){.topbar{padding:0 14px}.topnav{gap:15px}.workspace{grid-template-columns:1fr}.panel{min-height:360px}.table-wrap{height:calc(100% - 52px)}}@media(max-width:700px){.page{padding:12px 10px 24px}.topbar{height:auto;min-height:56px;align-items:flex-start;flex-direction:column;padding:12px}.topnav{width:100%;padding-bottom:2px}.page-intro{flex-direction:column;gap:10px}.intro-actions{width:100%}.intro-actions .button{flex:1}.filter-panel{align-items:flex-start;flex-direction:column;gap:10px}.filter-group{width:100%;overflow:auto}.tag-row{max-width:100%}.date-item{width:82px}.workspace{min-height:0}.panel{min-height:340px}.dialog-body{grid-template-columns:1fr}}
</style>
<style>.reason-btn{height:25px;padding:0 7px;border:1px solid #b2ddff;border-radius:3px;background:#eff8ff;color:#0958d9;font-size:10px}.reason-btn:hover{border-color:var(--primary);background:var(--primary-soft)}.sort-btn{display:flex;align-items:center;gap:4px;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-align:left}.sort-btn span{color:#98a2b3;font-size:10px}.sort-btn:hover{color:var(--primary)}.picker-field{grid-column:1/-1}.picker-field input{height:36px!important;border-color:#84caff!important;background:#f8fbff!important;font-weight:600}.picker-status{min-height:18px;color:var(--muted);font-size:11px}.picker-status.matched{color:#138a4b}.auto-field input[readonly]{color:#475467;background:#f8fafc;cursor:default}.auto-note{grid-column:1/-1;padding:8px 10px;border:1px solid #b2ddff;border-radius:4px;background:#eff8ff;color:#175cd3;font-size:11px}.reason-dialog{width:min(560px,calc(100vw - 28px))}.reason-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.reason-meta div{padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}.reason-meta small{display:block;margin-bottom:3px;color:var(--muted);font-size:10px}.reason-meta strong{font-size:12px}.reason-copy{min-height:110px;padding:12px;border:1px solid #b2ddff;border-radius:4px;background:#f8fbff;color:#344054;font-size:13px;line-height:1.75;white-space:pre-wrap}</style>
<style>
.date-viewport{flex:1;min-width:0}.date-list{min-width:0;width:100%;touch-action:pan-x;position:relative}.date-item{flex:0 0 calc((100% - 54px)/10);min-width:76px}
.form-field textarea{width:100%;min-height:96px;padding:8px;border:1px solid #d0d5dd;border-radius:4px;font:inherit;font-size:12px;resize:vertical;background:#f8fafc;color:#475467}
.table-wrap td.reason-cell{max-width:290px;overflow:hidden;text-overflow:ellipsis}.sort-btn{justify-content:space-between;min-width:56px}.sort-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.table-wrap th:nth-child(1),.table-wrap td:nth-child(1){position:sticky;left:0;min-width:92px;max-width:92px;z-index:1;background:#fff}.table-wrap th:nth-child(2),.table-wrap td:nth-child(2){position:sticky;left:92px;min-width:148px;max-width:148px;z-index:1;background:#fff}.table-wrap thead th:nth-child(-n+2){z-index:3;background:var(--soft)}.table-wrap tr.selected td:nth-child(-n+2){background:var(--primary-soft)}.table-wrap tbody tr:hover td:nth-child(-n+2){background:#f5f9ff}.table-wrap td:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.entity-options{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:4px}.entity-option{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px;border:0;border-bottom:1px solid var(--line);background:white;color:#344054;text-align:left;font-size:12px}.entity-option:hover,.entity-option:focus{background:var(--primary-soft)}.entity-option span{color:var(--muted)}.option-empty{padding:9px;color:var(--muted);font-size:12px}
@media(max-width:700px){.intro-actions{flex-wrap:wrap}.intro-actions .button{flex:1 1 auto}.panel-title{flex-wrap:wrap;gap:4px}.panel-head{flex-wrap:wrap}.panel-actions{margin-left:auto}.date-item{flex-basis:82px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">追</div><h1>板块自定义追踪</h1></div><nav class="topnav"><a href="./auction-monitor.html">竞价监控</a><a href="./market-management.html">市场管理</a><a href="./limit-up-ladder.html">连板天梯</a><a class="active" href="./custom-sector-tracker.html">板块自定义追踪</a><a href="./data-viewer.html">市场数据</a><a href="./history-viewer.html">历史数据</a><a href="./key-management.html">密钥管理</a></nav></header>
<main class="page">
<section class="page-intro"><div><h2>板块自定义追踪</h2><p id="dataStatus" role="status">正在读取交易日</p></div><div class="intro-actions"><button class="button" id="refreshData">刷新数据</button><button class="button" id="copyPrevious">沿用上次清单</button><button class="button" id="manageTags">管理天数标签</button><button class="button" id="exportPage">导出清单</button></div></section>
<section class="date-panel"><div class="section-label">交易日筛选 <small id="dateMeta">加载中</small></div><div class="date-strip"><button class="scroll-btn" id="datePrev" aria-label="向左查看更早交易日">‹</button><div class="date-viewport"><div class="date-list" id="dateList"></div></div><button class="scroll-btn" id="dateNext" aria-label="向右查看更新交易日">›</button></div></section>
<section class="filter-panel"><div class="filter-group"><span class="filter-name">板块方向</span><button class="seg active" data-direction="all">全部</button><button class="seg up" data-direction="up">涨板块</button><button class="seg down" data-direction="down">跌板块</button></div><div class="filter-group" style="flex:1;min-width:0"><span class="filter-name">天数标签</span><div class="tag-row" id="tagRow"></div><button class="tag tag-add" id="quickAddTag" aria-label="新增天数标签">+</button></div></section>
<section class="workspace"><article class="panel" id="boardPanel"><div class="panel-head"><div class="panel-title"><strong>自定义板块</strong><span id="boardMeta">0 个</span></div><div class="panel-actions"><button class="button" id="editBoard" disabled>编辑</button><button class="button danger" id="deleteBoard" disabled>删除</button><button class="button primary" id="addBoard">新增板块</button></div></div><div class="table-wrap"><table id="boardTable"><thead></thead><tbody></tbody></table></div></article><article class="panel" id="stockPanel"><div class="panel-head"><div class="panel-title"><strong>自定义个股</strong><span id="stockScope">选择板块查看关联个股</span></div><div class="panel-actions"><button class="button" id="editStock" disabled>编辑</button><button class="button danger" id="deleteStock" disabled>删除</button><button class="button primary" id="addStock">新增个股</button></div></div><div class="table-wrap"><table id="stockTable"><thead></thead><tbody></tbody></table></div></article></section>
</main>
<div class="toast hidden" id="toast" role="status"></div>
<dialog id="entityDialog"><div class="dialog-head"><strong id="entityTitle">新增板块</strong><button class="button" id="closeEntity">关闭</button></div><form id="entityForm"><div class="dialog-body" id="entityFields"></div><div class="dialog-foot"><button type="button" class="button" id="cancelEntity">取消</button><button type="submit" class="button primary">保存</button></div></form></dialog>
<dialog id="reasonDialog" class="reason-dialog"><div class="dialog-head"><strong id="reasonTitle">详细涨停原因</strong><button class="button" id="closeReason">关闭</button></div><div class="dialog-body" style="display:block"><div class="reason-meta" id="reasonMeta"></div><div class="section-label">详细涨停原因</div><div class="reason-copy" id="reasonCopy"></div></div><div class="dialog-foot"><button class="button primary" id="doneReason">完成</button></div></dialog>
<dialog id="tagDialog" class="tag-dialog"><div class="dialog-head"><strong>管理天数标签</strong><button class="button" id="closeTags">关闭</button></div><div class="dialog-body" style="display:block"><form class="tag-add-form" id="tagForm"><input id="tagInput" maxlength="12" placeholder="输入标签，例如：主线、补涨" required><button class="button primary">新增</button></form><div class="tag-list" id="tagList"></div></div><div class="dialog-foot"><button class="button primary" id="doneTags">完成</button></div></dialog>
<script type="module" src="./custom-sector-tracker.js"></script>
</body></html>
